<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bergmerke 3D – test med sikra Web Scene</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css" />
<style>
html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#17352d}
#viewDiv{position:absolute;inset:0}
#panel{position:absolute;z-index:10;left:12px;top:12px;width:min(340px,calc(100vw - 48px));background:rgba(255,255,255,.94);box-shadow:0 5px 25px #0003;border-radius:12px;padding:16px}
h1{font-size:18px;margin:0 0 6px}p{font-size:13px;margin:5px 0 12px;line-height:1.45}button{cursor:pointer;border:1px solid #97aca5;border-radius:8px;padding:9px 11px;background:#fff;font-weight:600;color:#17352d}button.active{background:#c92e31;color:white;border-color:#c92e31}button:disabled{opacity:.45;cursor:default}.buttons{display:flex;flex-wrap:wrap;gap:6px}.small{font-size:12px;white-space:pre-wrap;line-height:1.45}#status{margin:12px 0 0;background:#edf2ef;padding:8px;border-radius:6px}#error{margin-top:8px;color:#a41b24;word-break:break-word}#more{margin-top:10px;font-size:12px;color:#52665e}
</style>
<script src="https://js.arcgis.com/4.34/"></script>
</head>
<body>
<div id="viewDiv"></div>
<aside id="panel">
  <h1>Bergmerke 3D · prototyp</h1>
  <p>Opnar Web Scene frå kart-vegvesen.maps.arcgis.com. Logg inn dersom ArcGIS ber om det.</p>
  <div class="buttons">
    <button id="login">Logg inn med SSO</button>
    <button id="bolt" disabled>▲ Plasser bolt</button>
    <button id="navigate" class="active" disabled>Hand / naviger</button>
    <button id="undo" disabled>Angre siste</button>
    <button id="save" disabled>Lagre JSON</button>
  </div>
  <div id="status" class="small">Lastar ArcGIS JavaScript SDK …</div>
  <div id="error" class="small"></div>
  <div id="more">Merk: Annotasjonane er berre i nettlesaren fram til du lagrar JSON. Denne testen endrar ikkje Web Scene eller Enterprise-data.</div>
</aside>
<script>
(() => {
'use strict';
const ITEM_ID = 'fa7914fe23134a09a3c44483de2da30a';
const PORTAL_URL = 'https://kart-vegvesen.maps.arcgis.com';
const CLIENT_ID = '6jgJ7gpJHyIv5miA';
const $ = (id) => document.getElementById(id);
let mode = 'navigate', placed = [], view, annotations;
const status = (txt) => $('status').textContent = txt;
const error = (e) => { console.error(e); $('error').textContent = 'Feil: ' + (e?.message || String(e)); };
const enable = () => { $('bolt').disabled = false; $('navigate').disabled = false; $('save').disabled = !placed.length; $('undo').disabled = !placed.length; };
const changeMode = (m) => { mode = m; $('bolt').classList.toggle('active',m==='bolt'); $('navigate').classList.toggle('active',m==='navigate'); if(view) view.container.style.cursor = m==='bolt' ? 'crosshair':'default'; status(m==='bolt' ? 'Klikk på bergflata for å plassere ein bolt.' : 'Naviger i modellen. Vel «Plasser bolt» for annotering.'); };
$('bolt').onclick = () => changeMode('bolt');
$('navigate').onclick = () => changeMode('navigate');
$('undo').onclick = () => { const g=placed.pop(); if(g) annotations.remove(g); enable(); status(`${placed.length} bolt(ar) står att.`); };
$('save').onclick = () => {
  const result = {format:'Bergmerke3D',version:1,websceneId:ITEM_ID,portal:PORTAL_URL,exportedAt:new Date().toISOString(),graphics:placed.map(g=>g.toJSON())};
  const url = URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url;a.download='bergmerke-3d-boltar.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);
};
require([
  'esri/WebScene', 'esri/views/SceneView', 'esri/layers/GraphicsLayer', 'esri/Graphic', 'esri/portal/Portal', 'esri/portal/PortalItem', 'esri/identity/IdentityManager', 'esri/identity/OAuthInfo'
], function(WebScene,SceneView,GraphicsLayer,Graphic,Portal,PortalItem,esriId,OAuthInfo) {
  esriId.registerOAuthInfos([new OAuthInfo({appId:CLIENT_ID,portalUrl:PORTAL_URL,flowType:'auto',popup:false})]);
  const sharingUrl = PORTAL_URL + "/sharing";
  $('login').onclick = () => {
    status("Opnar SSO-pålogging …");
    esriId.getCredential(sharingUrl).then(startScene).catch(error);
  };
  let started = false;
  async function startScene(){
    if(started)return;started=true;
    $('login').hidden=true;
    await loadScene();
  }
  const portal = new Portal({url:PORTAL_URL});
  const scene = new WebScene({portalItem:new PortalItem({id:ITEM_ID,portal})});
  annotations = new GraphicsLayer({title:'Bergmerke – mellombelse boltar',elevationInfo:{mode:'absolute-height'}});
  view = new SceneView({container:'viewDiv',map:scene,popupEnabled:false,qualityProfile:'high'});
  async function loadScene() {
    try {
      status('Hentar sikra Web Scene …');
      await scene.load();
      await view.when();
      scene.add(annotations);
      enable();
      const meshLayers = scene.allLayers.filter(layer => layer.type === 'integrated-mesh' || layer.type === 'integrated-mesh-3dtiles');
      status(`Web Scene opna. ${meshLayers.length} Integrated Mesh-lag funne. Vel «Plasser bolt».`);
      if(!meshLayers.length) $('more').textContent += ' Eg fann ikkje eit Integrated Mesh-lag i sjølve scena; sjekk at det er synleg og lagt inn i Web Scene.';
      view.on('click', (evt) => {
        if(mode !== 'bolt') return;
        evt.stopPropagation();
        try {
          // toMap brukar den synlege mesh-overflata og deretter bakken når ingen mesh blir treft.
          const p = view.toMap({x:evt.x,y:evt.y});
          if(!p || !Number.isFinite(p.z)) {status('Ingen 3D-treff. Prøv å klikke direkte på modellen.');return;}
          const g = new Graphic({
            geometry:p.clone(),
            symbol:{type:'point-3d',symbolLayers:[{type:'icon',resource:{primitive:'triangle'},size:18,material:{color:'#e00000'},outline:{color:'#ffffff',size:1.3}}]},
            attributes:{category:'bolt',index:placed.length+1,createdAt:new Date().toISOString()}
          });
          annotations.add(g);placed.push(g);enable();
          status(`Bolt ${placed.length} plassert. X: ${p.x.toFixed(2)}, Y: ${p.y.toFixed(2)}, Z: ${p.z.toFixed(2)} (SR: ${p.spatialReference?.wkid ?? 'ukjent'}). Kontroller visuelt at treffpunktet er på meshen.`);
        } catch(e) {error(e);}
      });
    } catch(e) {error(e);status('Kunne ikkje opne scena. Kontroller tilgang til Web Scene og logg inn på nytt ved behov.');}
  }
  status('Kontrollerer SSO-innlogging …');
  esriId.checkSignInStatus(sharingUrl).then(startScene).catch(() => {
    status('Ikkje innlogga. Trykk «Logg inn med SSO».');
  });
});
})();
</script>
</body>
</html>
